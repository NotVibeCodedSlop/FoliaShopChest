name: FoliaChestShop
version: 1.0.0
main: com.NotVibeCodedSlop.foliashop.FoliaChestShop
api-version: '26.2'
folia-supported: true
description: Production-grade SMP Folia Chest Shop with complete persistence and security.

permissions:
  foliashop.use:
    description: Allows interacting and buying from chest shops.
    default: true
  foliashop.create:
    description: Allows configuring and creating chest shops using /shopconfig.
    default: true
  foliashop.delete:
    description: Allows deleting owned chest shops using /shopconfirm.
    default: true
  foliashop.admin:
    description: Bypass shop ownership checks and manage any shop.
    default: op
